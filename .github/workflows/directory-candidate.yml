name: Directory candidate
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and unpack the candidate
        run: |
          sh scripts/package.sh
          unzip -q dist/chattybox.zip -d dist
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: dist/chattybox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: directory-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/chattybox.zip
          if-no-files-found: error
          retention-days: 30
